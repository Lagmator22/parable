[project]
name = "parable"
version = "0.1.0"
description = "Parable: AI trading bots that can't hide their graveyard"
requires-python = ">=3.12"
dependencies = [
  "web3>=7.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "anthropic>=0.40",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyjwt[crypto]>=2.9",
  "arkiv-sdk>=1.0.0a1",
  "jinja2>=3.1",
  "mcp>=1.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
